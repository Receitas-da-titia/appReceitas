<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{baseLayout :: head}"></head>

<body>

<h1 th:text="${modoEdicao} ? 'Editar Receita' : 'Nova Receita'">Formulário de Receita</h1>

<form th:action="@{/receitas/nova}" th:object="${receita}" method="post">

    <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>

    <div>
        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" th:field="*{categoria}">
    </div>

    <div>
        <label for="ingredientes">Ingredientes</label>
        <textarea id="ingredientes" th:field="*{ingredientes}"></textarea>
    </div>

    <div>
        <label for="modoPreparo">Modo de Preparo</label>
        <textarea id="modoPreparo" th:field="*{modoPreparo}"></textarea>
    </div>

    <div>
        <label for="tempoPreparoMinutos">Tempo de Preparo (min)</label>
        <input type="number" id="tempoPreparoMinutos" th:field="*{tempoPreparoMinutos}">
    </div>

    <div>
        <label for="imagemUrl">Imagem (URL, opcional)</label>
        <input type="text" id="imagemUrl" th:field="*{imagemUrl}">
    </div>

    <button type="submit">Salvar</button>
    <a th:href="@{/receitas}">Cancelar</a>

</form>

<footer th:replace="~{baseLayout :: footer}"></footer>

</body>
</html>
