<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${receita.nome}">Detalhes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#923f2a',
                        'primary-dark': '#6b2d1c',
                        surface: '#fdf9f0',
                        'surface-alt': '#f7f3ea',
                        'on-surface': '#1c1c17',
                        'on-surface-variant': '#55423e',
                        accent: '#a03e40',
                    },
                    fontFamily: {
                        serif: ['Literata', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf9f0; }
        h1, h2, h3 { font-family: 'Literata', serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-surface text-on-surface font-sans">
    <div th:replace="~{layout-base :: header}"></div>

    <main class="flex-grow max-w-5xl mx-auto px-6 py-10">
        <div class="relative rounded-3xl overflow-hidden mb-8 shadow-md">
            <div class="h-80 bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center">
                <img th:if="${receita.imagem != null and !receita.imagem.isEmpty()}" 
                     th:src="${receita.imagem}" 
                     th:alt="${receita.nome}"
                     class="absolute inset-0 w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/40"></div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
                <span class="inline-block bg-white/20 backdrop-blur px-3 py-1 rounded-full text-sm mb-3" 
                      th:text="${categoria != null ? categoria.nomeCategoria : 'Sem categoria'}">Categoria</span>
                <h1 class="font-serif text-4xl font-bold mb-2" th:text="${receita.nome}">Nome</h1>
                <p class="opacity-90">⏱️ <strong th:text="${receita.tempoPreparo}">0</strong> minutos de preparo</p>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-8">
            <!-- INGREDIENTES -->
            <div class="md:col-span-1">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-24">
                    <h2 class="font-serif text-2xl font-bold text-primary mb-4">🥕 Ingredientes</h2>
                    <ul class="space-y-2">
                        <li th:each="ing : ${ingredientes}" class="flex items-start gap-2">
                            <span class="text-primary">✓</span>
                            <span th:text="${ing.nomeIngrediente}">Ingrediente</span>
                        </li>
                        <li th:if="${#lists.isEmpty(ingredientes)}" class="text-on-surface-variant italic">Nenhum ingrediente.</li>
                    </ul>
                </div>
            </div>

            <!-- MODO DE PREPARO + COMENTÁRIOS -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h2 class="font-serif text-2xl font-bold text-primary mb-4">👨‍🍳 Modo de Preparo</h2>
                    <p class="text-on-surface leading-relaxed whitespace-pre-line" th:text="${receita.modoPreparo}">Instruções...</p>
                </div>

                <!-- AÇÕES -->
                <div class="flex flex-wrap gap-3">
                    <form th:action="@{'/receitas/' + ${receita.idReceita} + '/favoritar'}" method="post">
                        <button type="submit" class="bg-accent text-white px-5 py-2 rounded-full font-semibold hover:opacity-90 transition">❤️ Favoritar</button>
                    </form>
                    <a th:href="@{'/receitas/' + ${receita.idReceita} + '/editar'}" class="bg-yellow-500 text-white px-5 py-2 rounded-full font-semibold hover:opacity-90 transition">✏️ Editar</a>
                    <form th:action="@{'/receitas/' + ${receita.idReceita} + '/excluir'}" method="post" onsubmit="return confirm('Excluir?');">
                        <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded-full font-semibold hover:opacity-90 transition">🗑️ Excluir</button>
                    </form>
                </div>

                <!-- COMENTÁRIOS -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h2 class="font-serif text-2xl font-bold text-primary mb-4">💬 Comentários</h2>
                    
                    <form th:action="@{'/receitas/' + ${receita.idReceita} + '/comentarios'}" method="post" th:object="${comentarioDTO}" class="mb-6">
                        <textarea th:field="*{comentario}" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-2" rows="3" placeholder="Deixe seu comentário..." required></textarea>
                        <button type="submit" class="bg-primary text-white px-5 py-2 rounded-full font-semibold hover:bg-primary-dark transition">Enviar</button>
                    </form>

                    <div class="space-y-3">
                        <div th:each="comentario : ${comentarios}" class="bg-surface-alt border-l-4 border-primary rounded-lg p-4">
                            <p class="text-on-surface mb-2" th:text="${comentario.texto}">Comentário</p>
                            <form th:action="@{'/comentarios/' + ${comentario.idComentario} + '/excluir'}" method="post" class="inline">
                                <input type="hidden" name="idReceita" th:value="${receita.idReceita}">
                                <button type="submit" class="text-red-600 text-sm hover:underline">Excluir</button>
                            </form>
                        </div>
                        <p th:if="${#lists.isEmpty(comentarios)}" class="text-on-surface-variant italic">Seja o primeiro a comentar!</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout-base :: footer}"></div>
</body>
</html>
