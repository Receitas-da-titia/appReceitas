<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Erro 500 - ' + ${titulo}">Erro interno do servidor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf9f0; }
        h1 { font-family: 'Literata', serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-surface text-on-surface font-sans">
    <div th:replace="~{layout-base :: header}"></div>

    <main class="flex-grow max-w-xl mx-auto px-6 py-16 text-center">
        <div class="bg-white rounded-2xl shadow-sm p-10 border border-gray-100">
            <div class="text-6xl mb-4">🍳</div>
            <p class="text-sm font-semibold text-primary mb-2">Erro 500</p>
            <h1 class="font-serif text-3xl font-bold text-primary mb-2" th:text="${titulo}">Erro interno do servidor</h1>
            <p class="text-on-surface-variant mb-6" th:text="${mensagem}">
                Algo deu errado na cozinha. Já fomos avisados e estamos corrigindo.
            </p>
            <a th:href="@{/}" class="bg-primary text-white px-6 py-2 rounded-full font-semibold hover:bg-primary-dark transition">← Voltar para o início</a>
        </div>
    </main>

    <div th:replace="~{layout-base :: footer}"></div>
</body>
</html>
