<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#923f2a',
                        'primary-dark': '#6b2d1c',
                        surface: '#fdf9f0',
                        'surface-alt': '#f7f3ea',
                        'on-surface': '#1c1c17',
                        'on-surface-variant': '#55423e',
                    },
                    fontFamily: {
                        serif: ['Literata', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf9f0; }
        h1, h2, h3 { font-family: 'Literata', serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-surface text-on-surface font-sans">
    <div th:replace="~{layout-base :: header}"></div>

    <main class="flex-grow max-w-6xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-4xl font-bold text-primary">📖 Receitas</h2>
            <a th:href="@{/receitas/nova}" class="bg-primary text-white px-5 py-2 rounded-full font-semibold hover:bg-primary-dark transition">➕ Nova Receita</a>
        </div>

        <!-- BUSCA -->
        <div class="bg-white rounded-2xl p-5 mb-8 shadow-sm border border-gray-100">
            <form th:action="@{/receitas}" method="get" class="flex gap-3">
                <input type="text" name="nome" th:value="${nome}" class="flex-1 px-4 py-2 border border-gray-300 rounded-full" placeholder="🔍 Buscar receita...">
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded-full font-semibold hover:bg-primary-dark transition">Buscar</button>
                <a th:href="@{/receitas}" class="bg-gray-200 text-on-surface px-6 py-2 rounded-full font-semibold hover:bg-gray-300 transition">Limpar</a>
            </form>
        </div>

        <!-- GRID DE RECEITAS -->
        <div class="grid md:grid-cols-3 gap-6">
            <a th:each="receita : ${receitas}" 
               th:href="@{'/receitas/' + ${receita.idReceita}}"
               class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition border border-gray-100 group">
                <div class="h-48 bg-surface-alt overflow-hidden">
                    <img th:if="${receita.imagem != null and !receita.imagem.isEmpty()}" 
                         th:src="${receita.imagem}" 
                         th:alt="${receita.nome}"
                         class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <div th:if="${receita.imagem == null or receita.imagem.isEmpty()}" class="w-full h-full flex items-center justify-center text-6xl">🍽️</div>
                </div>
                <div class="p-5">
                    <h3 class="font-serif text-xl font-bold text-on-surface mb-2 group-hover:text-primary transition" th:text="${receita.nome}">Nome</h3>
                    <p class="text-sm text-on-surface-variant">⏱️ <span th:text="${receita.tempoPreparo}">0</span> min</p>
                </div>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(receitas)}" class="text-center py-16">
            <div class="text-6xl mb-4">🍽️</div>
            <h3 class="text-xl text-on-surface-variant mb-4">Nenhuma receita encontrada</h3>
            <a th:href="@{/receitas/nova}" class="bg-primary text-white px-6 py-2 rounded-full font-semibold hover:bg-primary-dark transition">Cadastrar a primeira!</a>
        </div>
    </main>

    <div th:replace="~{layout-base :: footer}"></div>
</body>
</html>
