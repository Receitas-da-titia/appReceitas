<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#923f2a',
                        'primary-dark': '#6b2d1c',
                        surface: '#fdf9f0',
                        'surface-alt': '#f7f3ea',
                        'on-surface': '#1c1c17',
                        'on-surface-variant': '#55423e',
                        accent: '#a03e40',
                    },
                    fontFamily: {
                        serif: ['Literata', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf9f0; }
        h1, h2, h3 { font-family: 'Literata', serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-surface text-on-surface font-sans">
    <div th:replace="~{layout-base :: header}"></div>

    <main class="flex-grow max-w-md mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2">✨</div>
                <h2 class="font-serif text-3xl font-bold text-primary">Criar Conta</h2>
                <p class="text-on-surface-variant mt-1">Junte-se à nossa cozinha</p>
            </div>

            <div th:if="${erro}" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm" th:text="${erro}"></div>

            <form th:action="@{/cadastro}" th:object="${usuarioDTO}" method="post" class="space-y-4">
                <div>
                    <label for="nome" class="block text-sm font-semibold text-on-surface-variant mb-1">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-xs mt-1"></p>
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-on-surface-variant mb-1">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-xs mt-1"></p>
                </div>
                <div>
                    <label for="senha" class="block text-sm font-semibold text-on-surface-variant mb-1">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                    <p th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="text-red-600 text-xs mt-1"></p>
                </div>
                <button type="submit" class="w-full bg-accent text-white py-2 rounded-full font-semibold hover:opacity-90 transition">Cadastrar</button>
            </form>

            <hr class="my-6">
            <p class="text-center text-sm text-on-surface-variant">
                Já tem conta? <a th:href="@{/login}" class="text-primary font-semibold hover:underline">Faça login</a>
            </p>
        </div>
    </main>

    <div th:replace="~{layout-base :: footer}"></div>
</body>
</html>
