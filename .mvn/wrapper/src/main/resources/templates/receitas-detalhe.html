<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{baseLayout :: head}"></head>

<body>

<h1 th:text="${receita.nome}">Nome da Receita</h1>

<p><strong>Categoria:</strong> <span th:text="${receita.categoria}"></span></p>
<p><strong>Tempo de preparo:</strong> <span th:text="${receita.tempoPreparoMinutos}"></span> minutos</p>

<h2>Ingredientes</h2>
<p th:text="${receita.ingredientes}"></p>

<h2>Modo de Preparo</h2>
<p th:text="${receita.modoPreparo}"></p>

<p>
    <a th:href="@{/receitas/{id}/editar(id=${receita.id})}">Editar</a>
    &nbsp;|&nbsp;
    <a th:href="@{/receitas}">Voltar para a lista</a>
</p>

<footer th:replace="~{baseLayout :: footer}"></footer>

</body>
</html>
